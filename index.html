<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學員問題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: three columns, one per level of the sheet (關鍵字 > 問題類型 > 學員問題). Click a question to project it large. */
:root{
  --paper:#000000; --card:#0B0E14; --ink:#F5F7FB; --muted:#A9B4C8; --rule:#2A3243;
  --mark:#FFD23F; --mark-ink:#0B0E14; --accent:#9FB0FF; --done:#7C879C;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-q:var(--f-ui);
  color-scheme:dark;
}

*{box-sizing:border-box}
header,.wheelview,main{position:relative;z-index:1}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px 24px;border-bottom:1px solid var(--rule);background:var(--paper)}
h1{font-family:var(--f-ui);font-weight:700;font-size:24px;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px}
.progress{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.bar{width:120px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative}
.search input{width:min(320px,70vw);height:44px;padding:0 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.btn{height:44px;padding:0 16px;border:1px solid var(--ink);border-radius:8px;background:transparent;font-weight:500}
.btn:hover{background:var(--ink);color:#000}
.btn.primary{background:var(--mark);color:var(--mark-ink);border-color:var(--mark-ink)}
.btn.primary:hover{background:var(--mark-ink);color:var(--mark)}
.btn.quiet{border-color:var(--rule);color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,.8fr) minmax(240px,1fr) minmax(320px,2.2fr)}
.col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.col:last-child{border-right:0}
.col h2{margin:0;padding:12px 20px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px}
.crumb{display:none}
.list{flex:1;overflow-y:auto;list-style:none;margin:0;padding:8px 0}
.item{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 20px;border-left:6px solid transparent}
.item:hover{background:var(--card)}
.item[aria-current="true"]{background:var(--mark);color:var(--mark-ink);border-left-color:var(--mark-ink)}
.item .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-weight:500}
.item .n{font-variant-numeric:tabular-nums;font-size:14px;opacity:.75;white-space:nowrap}
.item .track{height:3px;background:var(--rule);margin-top:8px;border-radius:2px;overflow:hidden}
.item[aria-current="true"] .track{background:rgba(11,14,20,.3)}
.item .track i{display:block;height:100%;background:var(--accent);width:0}
.item[aria-current="true"] .track i{background:var(--mark-ink)}

.q{display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--rule)}
.q:hover{background:var(--card)}
.q .chk{flex:none;width:26px;height:26px;margin-top:2px;border:2px solid var(--muted);border-radius:6px;background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.q .chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000}
.q .txt{flex:1;text-align:left;background:none;border:0;padding:0;font-size:17px;line-height:1.65}
.q.is-done .txt{color:var(--done);text-decoration:line-through;text-decoration-color:var(--rule)}
.q .tag{display:block;font-size:13px;color:var(--muted);margin-bottom:2px;text-decoration:none}
.empty{padding:40px 20px;color:var(--muted)}

@media (max-width:860px){
  header{padding:12px 16px}
  .tools{margin-left:0;width:100%}
  .search{flex:1}.search input{width:100%}
  main{display:block;overflow:hidden;position:relative}
  .col{position:absolute;inset:0;display:none;border-right:0}
  main[data-level="0"] .c0,main[data-level="1"] .c1,main[data-level="2"] .c2{display:flex}
  .crumb{display:inline-flex;height:32px;padding:0 12px;border:1px solid var(--rule);border-radius:16px;background:none;font-size:14px;align-items:center}
  .col h2{padding:10px 16px}
  .item,.q{padding-left:16px;padding-right:16px}
  .bar{width:80px}
}
/* wheel view (OptionWheel, ported to plain JS) */
.wheelview{flex:1;min-height:0;display:flex;flex-direction:column}
.steps{display:flex;gap:0;border-bottom:1px solid var(--rule);background:var(--paper)}
.stepbtn{flex:1;text-align:left;background:none;border:0;border-bottom:5px solid transparent;padding:10px 20px;min-width:0}
.stepbtn small{display:block;font-size:13px;color:var(--muted)}
.stepbtn b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepbtn[aria-current="step"]{border-bottom-color:var(--mark)}
.stepbtn:disabled{opacity:.45;cursor:default}
.wv{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.wheelbox{position:relative;min-height:0;border-right:1px solid var(--rule);overflow:hidden}
.wheelbox::after{content:"";position:absolute;left:0;right:0;top:50%;height:0;pointer-events:none}
.wv--solo{grid-template-columns:1fr}
.wv--solo .panel{display:none}
.wv--solo .wheelbox{border-right:0}
.whint{position:absolute;left:var(--ow-inset,40px);bottom:16px;margin:0;font-size:14px;color:var(--muted);pointer-events:none}
.panel{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px clamp(20px,4vw,56px);overflow-y:auto}
.panel .hint{color:var(--muted);font-size:14px;margin:0}
.panel .pk{font-family:var(--f-ui);font-weight:700;font-size:clamp(28px,4vw,52px);line-height:1.3;margin:0;text-wrap:balance}
.panel .pq{font-family:var(--f-ui);font-weight:500;font-size:clamp(22px,2.6vw,36px);line-height:1.6;margin:0;border-left:8px solid var(--mark);padding-left:20px}
.panel .meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel .meta .bar{width:160px}
.panel .acts{display:flex;gap:12px;flex-wrap:wrap}
.option-wheel{--ow-text-color:var(--muted);--ow-active-color:var(--ink);--ow-font-size:3rem;--ow-inset:40px;position:absolute;inset:0;overflow:hidden;cursor:grab;user-select:none;touch-action:none;outline:none}
.option-wheel:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
.option-wheel--dragging{cursor:grabbing}
.option-wheel__item{position:absolute;top:50%;left:var(--ow-inset);white-space:nowrap;font-size:var(--ow-font-size);line-height:1;font-weight:300;transform-origin:left center;cursor:pointer;will-change:transform,opacity,filter;color:color-mix(in srgb,var(--ow-active-color) calc(var(--ow-p,0)*100%),var(--ow-text-color))}
.option-wheel__item--selected{font-weight:700}
.option-wheel__item.is-done{text-decoration:line-through}
.wheelview[hidden],main[hidden]{display:none}

/* concentric rings */
.rings .option-wheel__item{padding-left:12px}
.rg{position:absolute;inset:0;pointer-events:none}
.rg .option-wheel__item{pointer-events:auto}
.rg--done .option-wheel__item--selected{--ow-active-color:var(--mark)}
.ringmode #steps{display:none}
.ringmode .wv{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
.ringmode .wheelbox{border-right:0}
.ringmode .panel{flex-direction:row;align-items:center;justify-content:space-between;gap:24px;padding:14px 24px;border-top:1px solid var(--rule);background:var(--paper)}
.ringmode .panel:empty{display:none}
.ringmode .panel .capmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ringmode .panel .pq{font-size:clamp(22px,2.8vw,44px);border-left-width:6px;padding-left:16px}
.ringmode .panel .btn{flex:none}
@media (max-width:860px){
  .wv{grid-template-columns:1fr;grid-template-rows:minmax(280px,46%) 1fr}
  .wv--solo{grid-template-rows:1fr}
  .wheelbox{border-right:0;border-bottom:1px solid var(--rule)}
  .stepbtn{padding:8px 12px}.stepbtn b{font-size:15px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:no-preference){
  .item,.btn{transition:background .12s,color .12s}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>學員問題庫</h1>
  </div>
  <div class="tools">
    <div class="search" id="searchBox" hidden><label for="s" hidden>搜尋問題</label><input id="s" type="search" placeholder="搜尋全部問題，例如：作品集、面試"></div>
    <button class="btn" id="viewBtn" type="button">切到清單檢視</button>
    <button class="btn primary" id="rand" type="button">隨機抽一題</button>
    <button class="btn quiet" id="reset" type="button">清除已回答</button>
  </div>
</header>

<div class="wheelview" id="wheelView">
  <div class="steps" id="steps"></div>
  <div class="wv" id="wv"><div class="wheelbox" id="wheelBox"></div><div class="panel" id="panel"></div></div>
</div>

<main id="main" data-level="0" hidden>
  <section class="col c0" aria-label="關鍵字">
    <h2><span>關鍵字</span></h2>
    <ul class="list" id="l0"></ul>
  </section>
  <section class="col c1" aria-label="問題類型">
    <h2><button class="crumb" id="b1" type="button">‹ 關鍵字</button><span id="h1t">問題類型</span></h2>
    <ul class="list" id="l1"></ul>
  </section>
  <section class="col c2" aria-label="學員問題">
    <h2><button class="crumb" id="b2" type="button">‹ 問題類型</button><span id="h2t">學員問題</span></h2>
    <ul class="list" id="l2"></ul>
  </section>
</main>

// flatten: [{id,k,t,q}]
const ALL=[]; const KW=[]; const TY={};
for(const k of Object.keys(DATA)){KW.push(k);TY[k]=[];for(const t of Object.keys(DATA[k])){TY[k].push(t);for(const q of DATA[k][t])ALL.push({id:ALL.length,k,t,q});}}
const KEY='qbank-done-v1';
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};

const st={k:KW[0],t:'all',s:'',level:0,stage:-1,view:'wheel'};
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

function inKw(k){return ALL.filter(x=>x.k===k)}
function inTy(k,t){return ALL.filter(x=>x.k===k&&x.t===t)}
function current(){
  if(st.s.trim()){const w=st.s.trim().toLowerCase();return ALL.filter(x=>(x.q+x.k+x.t).toLowerCase().includes(w))}
  return st.t==='all'?inKw(st.k):inTy(st.k,st.t);
}
function stat(list){const d=list.filter(x=>done.has(x.id)).length;return {n:list.length,d}}

function navItem(label,list,active,onclick){
  const li=el('li');const b=el('button','item');b.type='button';
  if(active)b.setAttribute('aria-current','true');
  const r=el('span','row');r.append(el('span',null,label));
  const s=stat(list);r.append(el('span','n',s.d+' / '+s.n));
  const tr=el('span','track');const i=el('i');i.style.width=(s.n?100*s.d/s.n:0)+'%';tr.append(i);
  b.append(r,tr);b.onclick=onclick;li.append(b);return li;
}
function render(){
  const searching=!!st.s.trim();
  const l0=$('l0');l0.replaceChildren();
  for(const k of KW)l0.append(navItem(k,inKw(k),!searching&&k===st.k,()=>{st.k=k;st.t='all';st.s='';$('s').value='';st.level=1;render()}));
  const l1=$('l1');l1.replaceChildren();
  $('h1t').textContent=searching?'搜尋中':st.k;
  if(!searching){
    l1.append(navItem('全部類型',inKw(st.k),st.t==='all',()=>{st.t='all';st.level=2;render()}));
    for(const t of TY[st.k])l1.append(navItem(t,inTy(st.k,t),st.t===t,()=>{st.t=t;st.level=2;render()}));
  } else {const li=el('li','empty','清除搜尋框即可回到分類瀏覽。');l1.append(li)}
  const list=current();
  $('h2t').textContent=searching?('搜尋結果 '+list.length+' 題'):((st.t==='all'?'全部類型':st.t)+' · '+list.length+' 題');
  const l2=$('l2');l2.replaceChildren();
  if(!list.length){l2.append(el('li','empty','沒有符合的問題。換個關鍵字再試一次。'))}
  list.forEach((x,i)=>{
    const li=el('li','q'+(done.has(x.id)?' is-done':''));
    const c=el('button','chk','✓');c.type='button';c.id='c'+x.id;c.setAttribute('aria-pressed',done.has(x.id));c.setAttribute('aria-label','標記已回答');
    c.onclick=()=>{toggle(x.id)};
    const t=el('button','txt');t.type='button';
    if(searching||st.t==='all'){t.append(el('span','tag',searching?x.k+' › '+x.t:x.t))}
    t.append(document.createTextNode(x.q));
    t.onclick=()=>toggle(x.id);
    li.append(c,t);l2.append(li);
  });
  updProg();
  $('main').dataset.level=st.level;
  $('b1').onclick=()=>{st.level=0;render()};$('b2').onclick=()=>{st.level=1;render()};
}
function updProg(){}
function toggle(id){done.has(id)?done.delete(id):done.add(id);save();render();if(st.view==='wheel'&&ws.step===2)refreshWheel();updProg()}

/* OptionWheel port (React Bits), plain JS */
function makeWheel(box,o){
  const cfg={fontSize:o.fontSize,spacing:1.4,curve:1,tilt:6,blur:2,fade:.25,minOpacity:.05,smoothing:200};
  const root=document.createElement('div');root.className='option-wheel';root.tabIndex=0;root.setAttribute('role','listbox');root.setAttribute('aria-label',o.label);
  root.style.setProperty('--ow-font-size',cfg.fontSize+'rem');
  const remPx=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
  const rowH=Math.max(cfg.fontSize*cfg.spacing*remPx,1);
  const n=o.items.length;
  let pos=o.defaultSelected,target=pos,sel=pos,raf=null,last=0,drag=null,moved=false,wt=null;
  const els=o.items.map((it,i)=>{const d=document.createElement('div');d.className='option-wheel__item'+(it.done?' is-done':'')+(i===sel?' option-wheel__item--selected':'');d.setAttribute('role','option');d.textContent=it.text;d.onclick=()=>click(i);root.append(d);return d});
  const frame=now=>{
    const dt=Math.min((now-last)/1000,.05);last=now;
    const k=1-Math.exp(-dt/(cfg.smoothing/1000));
    let next=pos+(target-pos)*k;const settled=Math.abs(target-next)<.001;if(settled)next=target;pos=next;
    const tr=cfg.tilt*Math.PI/180,R=rowH/tr;
    for(let i=0;i<n;i++){
      const d=i-next,dist=Math.abs(d);
      const ang=Math.max(-Math.PI/2,Math.min(Math.PI/2,d*tr));
      const y=R*Math.sin(ang),x=-R*(1-Math.cos(ang))*cfg.curve,rot=ang*180/Math.PI;
      const e=els[i];
      e.style.transform='translate('+x.toFixed(2)+'px, calc('+y.toFixed(2)+'px - 50%)) rotate('+rot.toFixed(3)+'deg)';
      e.style.opacity=String(Math.max(cfg.minOpacity,1-dist*cfg.fade));
      e.style.filter='blur('+(dist*cfg.blur).toFixed(2)+'px)';
      e.style.setProperty('--ow-p',Math.max(0,1-Math.min(dist,1)).toFixed(4));
    }
    raf=settled?null:requestAnimationFrame(frame);
  };
  const start=()=>{if(raf!=null)cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(frame)};
  const apply=(v,snap)=>{
    v=Math.min(Math.max(v,0),Math.max(n-1,0));if(snap)v=Math.round(v);target=v;
    const idx=Math.round(v);
    if(idx!==sel){els[sel].classList.remove('option-wheel__item--selected');sel=idx;els[sel].classList.add('option-wheel__item--selected');o.onChange(idx)}
    start();
  };
  function click(i){if(moved)return;if(i===sel)o.onPick(i);else apply(i,true)}
  root.addEventListener('wheel',e=>{
    e.preventDefault();
    const delta=e.deltaMode===1?e.deltaY*24:e.deltaY;
    apply(target+Math.max(-1,Math.min(1,delta/rowH)),false);
    clearTimeout(wt);wt=setTimeout(()=>apply(target,true),140);
  },{passive:false});
  root.addEventListener('pointerdown',e=>{drag={y:e.clientY,s:target,id:e.pointerId};moved=false;root.classList.add('option-wheel--dragging')});
  root.addEventListener('pointermove',e=>{
    if(!drag)return;const dy=e.clientY-drag.y;
    if(!moved&&Math.abs(dy)>4){moved=true;try{root.setPointerCapture(drag.id)}catch(_){}}
    if(moved)apply(drag.s-dy/rowH,false);
  });
  const end=()=>{if(!drag)return;drag=null;root.classList.remove('option-wheel--dragging');if(moved){apply(target,true);setTimeout(()=>{moved=false},0)}};
  root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
  root.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();apply(Math.round(target)-1,true)}
    else if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();apply(Math.round(target)+1,true)}
    else if(e.key==='Enter'){e.preventDefault();o.onPick(sel)}
  });
  box.replaceChildren(root);start();
  return {destroy(){if(raf!=null)cancelAnimationFrame(raf);clearTimeout(wt)},focus(){root.focus({preventScroll:true})}};
}

const STEP_NAMES=['關鍵字','問題類型','學員問題'];
const small=()=>window.innerWidth<=860;
function wsList(){return ws.t==='all'?inKw(ws.k):inTy(ws.k,ws.t)}
function wsItems(){
  if(ws.step===0)return KW.map(k=>({text:k,list:inKw(k)}));
  if(ws.step===1)return [{text:'全部類型',list:inKw(ws.k),val:'all'}].concat(TY[ws.k].map(t=>({text:t,list:inTy(ws.k,t),val:t})));
  const max=small()?13:20;
  return wsList().map(x=>({text:x.q.length>max?x.q.slice(0,max)+'…':x.q,done:done.has(x.id),q:x}));
}
function renderSeq(keepFocus){
  $('wheelView').classList.remove('ringmode');
  if(ws.wheel)ws.wheel.destroy();
  const items=wsItems();
  ws.idx[ws.step]=Math.min(ws.idx[ws.step],items.length-1);
  const sz=small()?[2,1.6,1.1]:[3,2.4,1.3];
  // steps bar
  const sb=$('steps');sb.replaceChildren();
  const vals=[ws.k,ws.t==='all'?'全部類型':ws.t,'選一題'];
  STEP_NAMES.forEach((nm,i)=>{
    const b=el('button','stepbtn');b.type='button';b.disabled=i>ws.step;
    if(i===ws.step)b.setAttribute('aria-current','step');
    const s=el('small',null,nm);const v=el('b',null,i<ws.step?vals[i]:(i===ws.step?'選擇中':'—'));
    b.append(s,v);b.onclick=()=>{ws.step=i;renderWheel()};sb.append(b);
  });
  const onPick=i=>{
    const it=wsItems()[i];
    if(ws.step===0){ws.k=it.text;ws.t='all';ws.idx[1]=0;ws.idx[2]=0;ws.step=1;renderWheel()}
    else if(ws.step===1){ws.t=it.val;ws.idx[2]=0;ws.step=2;renderWheel()}
  };
  const onChange=i=>{ws.idx[ws.step]=i;renderPanel()};
  ws.wheel=makeWheel($('wheelBox'),{items,defaultSelected:ws.idx[ws.step],fontSize:sz[ws.step],label:STEP_NAMES[ws.step],onChange,onPick});
  ws.onPick=onPick;
  $('wv').classList.toggle('wv--solo',ws.step<2);
  if(ws.step<2){const h=el('p','whint','點中間那一項，進入下一層');$('wheelBox').append(h)}
  renderPanel();
  if(keepFocus!==false)ws.wheel.focus();
}
function renderPanel(){
  const p=$('panel');p.replaceChildren();
  const items=wsItems();const it=items[ws.idx[ws.step]];if(!it)return;
  if(ws.step<2)return;
  {
    const x=it.q;
    p.append(el('p','hint',x.k+' › '+x.t+'　第 '+(ws.idx[2]+1)+' / '+items.length+' 題'));
    p.append(el('p','pq',x.q));
    const a=el('div','acts');
    const b2=el('button','btn primary',done.has(x.id)?'取消已回答':'標記已回答');b2.type='button';b2.onclick=()=>toggle(x.id);
    a.append(b2);p.append(a);
  }
}
/* concentric rings: one OptionWheel per level, sharing a centre */
function makeRings(box,g,h){
  const root=document.createElement('div');root.className='option-wheel rings';root.tabIndex=0;root.setAttribute('role','group');root.setAttribute('aria-label','三層選擇：關鍵字、問題類型、學員問題');
  const rings=[null,null,null];
  let raf=null,last=0,drag=null,moved=false,wt=null,wheelRing=0,active=0;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clampN=(v,a,b)=>Math.min(b,Math.max(a,v));
  function setActive(a){active=a;rings.forEach((r,i)=>{if(!r)return;r.wrap.classList.toggle('rg--active',i===a);r.wrap.classList.toggle('rg--done',i<a)})}
  function setRing(i,items,def,anim){
    if(rings[i])rings[i].wrap.remove();
    const R=g.R[i],wrap=document.createElement('div');wrap.className='rg';
    const r={wrap,R,rowH:g.rowH[i],tilt:g.rowH[i]/R,pos:def,target:def,sel:def,n:items.length,els:[]};
    r.els=items.map((it,j)=>{
      const e=document.createElement('div');
      e.className='option-wheel__item'+(it.done?' is-done':'')+(j===def?' option-wheel__item--selected':'');
      e.style.left=g.cx+'px';e.style.top=g.cy+'px';e.style.fontSize=g.fs[i]+'px';e.setAttribute('role','option');e.textContent=it.text;
      e.onclick=()=>click(i,j);wrap.append(e);return e;
    });
    rings[i]=r;root.append(wrap);
    if(anim!==false&&!reduced)wrap.animate([{opacity:0},{opacity:1}],{duration:380,easing:'ease-out'});
    setActive(active);start();
  }
  function hide(from){for(let i=from;i<3;i++)if(rings[i]){rings[i].wrap.remove();rings[i]=null}}
  const frame=now=>{
    const dt=Math.min((now-last)/1000,.05);last=now;
    const k=1-Math.exp(-dt/.2);let busy=false;
    rings.forEach(r=>{
      if(!r)return;
      let next=r.pos+(r.target-r.pos)*k;const settled=Math.abs(r.target-next)<.001;
      if(settled)next=r.target;else busy=true;r.pos=next;
      for(let j=0;j<r.n;j++){
        const d=j-next,dist=Math.abs(d),ang=clampN(d*r.tilt,-Math.PI/2,Math.PI/2),e=r.els[j];
        e.style.transform='translate('+(r.R*Math.cos(ang)).toFixed(2)+'px, calc('+(r.R*Math.sin(ang)).toFixed(2)+'px - 50%)) rotate('+(ang*180/Math.PI).toFixed(3)+'deg)';
        e.style.opacity=String(Math.max(.05,1-dist*.25));
        e.style.filter=dist>0?'blur('+(dist*2).toFixed(2)+'px)':'none';
        e.style.setProperty('--ow-p',Math.max(0,1-Math.min(dist,1)).toFixed(4));
      }
    });
    raf=busy?requestAnimationFrame(frame):null;
  };
  function start(){if(raf!=null)cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(frame)}
  function apply(i,v,snap){
    const r=rings[i];if(!r)return;
    v=clampN(v,0,Math.max(r.n-1,0));if(snap)v=Math.round(v);r.target=v;
    const idx=Math.round(v);
    if(idx!==r.sel){r.els[r.sel].classList.remove('option-wheel__item--selected');r.sel=idx;r.els[idx].classList.add('option-wheel__item--selected');h.onChange(i,idx)}
    start();
  }
  function ringAt(e){
    const rc=root.getBoundingClientRect(),dist=Math.hypot(e.clientX-rc.left-g.cx,e.clientY-rc.top-g.cy);
    let best=-1,bd=1e9;
    rings.forEach((r,i)=>{if(!r)return;const dd=Math.abs(dist-r.R);if(dd<bd){bd=dd;best=i}});
    return best<0?active:best;
  }
  function click(i,j){if(moved)return;const r=rings[i];if(!r)return;if(j===r.sel)h.onPick(i,j);else apply(i,j,true)}
  root.addEventListener('wheel',e=>{
    e.preventDefault();
    const i=ringAt(e),r=rings[i];if(!r)return;wheelRing=i;
    const delta=e.deltaMode===1?e.deltaY*24:e.deltaY;
    apply(i,r.target+clampN(delta/r.rowH,-1,1),false);
    clearTimeout(wt);wt=setTimeout(()=>{const q=rings[wheelRing];if(q)apply(wheelRing,q.target,true)},140);
  },{passive:false});
  root.addEventListener('pointerdown',e=>{const i=ringAt(e),r=rings[i];if(!r)return;drag={y:e.clientY,i,s:r.target,id:e.pointerId};moved=false;root.classList.add('option-wheel--dragging')});
  root.addEventListener('pointermove',e=>{
    if(!drag)return;const dy=e.clientY-drag.y;
    if(!moved&&Math.abs(dy)>4){moved=true;try{root.setPointerCapture(drag.id)}catch(_){}}
    if(moved&&rings[drag.i])apply(drag.i,drag.s-dy/rings[drag.i].rowH,false);
  });
  const end=()=>{if(!drag)return;const i=drag.i;drag=null;root.classList.remove('option-wheel--dragging');if(moved){if(rings[i])apply(i,rings[i].target,true);setTimeout(()=>{moved=false},0)}};
  root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
  root.addEventListener('keydown',e=>{
    const r=rings[active];if(!r)return;
    if(e.key==='ArrowUp'){e.preventDefault();apply(active,Math.round(r.target)-1,true)}
    else if(e.key==='ArrowDown'){e.preventDefault();apply(active,Math.round(r.target)+1,true)}
    else if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();h.onPick(active,r.sel)}
    else if(e.key==='ArrowLeft'||e.key==='Escape'||e.key==='Backspace'){e.preventDefault();h.onBack()}
  });
  box.replaceChildren(root);
  return {setRing,hide,setActive,focus(){root.focus({preventScroll:true})},destroy(){if(raf!=null)cancelAnimationFrame(raf);clearTimeout(wt)}};
}
function ringGeom(box){
  const W=box.clientWidth||window.innerWidth,H=box.clientHeight||500,cx=28,cy=H/2;
  const clampN=(v,a,b)=>Math.min(b,Math.max(a,v));
  let r=clampN(W/1280,.5,2.2);r=Math.min(r,(W-cx-28-300)/640);r=Math.max(r,.45);
  const R=[100*r,360*r,640*r];
  const maxLen0=Math.max(...KW.map(k=>k.length)),maxLen1=Math.max(4,...Object.values(TY).flat().map(t=>t.length));
  const avail=[R[1]-R[0]-28,R[2]-R[1]-28,W-cx-R[2]-28];
  const fs=[clampN(avail[0]/maxLen0,14,38*r),clampN(avail[1]/maxLen1,14,30*r),clampN(avail[2]/26,15,28*r)];
  return {W,H,cx,cy,R,fs,rowH:fs.map(f=>f*1.55),maxc1:Math.max(3,Math.floor(avail[1]/fs[1])),maxc2:Math.max(6,Math.floor((avail[2]-48)/fs[2]))};
}
function ringItems(i,g){
  if(i===0)return KW.map(k=>({text:k}));
  if(i===1)return [{text:'全部類型',val:'all'}].concat(TY[ws.k].map(t=>({text:t.length>g.maxc1?t.slice(0,g.maxc1)+'…':t,val:t})));
  return wsList().map(x=>({text:x.q.length>g.maxc2?x.q.slice(0,g.maxc2)+'…':x.q,done:done.has(x.id),q:x}));
}
function renderCaption(){
  const p=$('panel');p.replaceChildren();
  if(ws.step<2)return;
  const x=wsList()[ws.idx[2]];if(!x)return;
  const main=el('div','capmain');main.append(el('p','hint',x.k+' › '+x.t+'　第 '+(ws.idx[2]+1)+' / '+wsList().length+' 題'),el('p','pq',x.q));
  const b=el('button','btn primary',done.has(x.id)?'取消已回答':'標記已回答');b.type='button';b.onclick=()=>toggle(x.id);
  p.append(main,b);
}
function renderRings(keepFocus){
  if(ws.wheel)ws.wheel.destroy();
  $('wheelView').classList.add('ringmode');$('wv').classList.remove('wv--solo');
  const box=$('wheelBox'),g=ringGeom(box);ws.geom=g;
  const R=makeRings(box,g,{
    onChange(i,idx){
      ws.idx[i]=idx;
      if(i===0){ws.k=KW[idx];ws.t='all';ws.idx[1]=0;ws.idx[2]=0;if(ws.step>0){ws.step=0;R.hide(1);R.setActive(0)}}
      else if(i===1){ws.t=ringItems(1,g)[idx].val;ws.idx[2]=0;if(ws.step>1){ws.step=1;R.hide(2);R.setActive(1)}}
      updateRingUi();
    },
    onPick(i){
      if(i!==ws.step||i>1)return;
      if(i===0){ws.t='all';ws.idx[1]=0;ws.idx[2]=0;ws.step=1;R.setRing(1,ringItems(1,g),0);R.setActive(1)}
      else{ws.idx[2]=0;ws.step=2;R.setRing(2,ringItems(2,g),0);R.setActive(2)}
      updateRingUi();
    },
    onBack(){if(ws.step>0){ws.step--;R.hide(ws.step+1);R.setActive(ws.step);updateRingUi()}}
  });
  ws.wheel=R;
  for(let i=0;i<=ws.step;i++)R.setRing(i,ringItems(i,g),ws.idx[i],false);
  R.setActive(ws.step);
  const hint=el('p','whint','點中間那一項，展開下一圈');hint.id='rhint';hint.style.left=g.cx+'px';box.append(hint);
  updateRingUi();
  if(keepFocus!==false)R.focus();
}
function updateRingUi(){renderCaption();const h=$('rhint');if(h)h.hidden=ws.step>=2}
function refreshWheel(){
  if(small()||!ws.geom||!$('wheelView').classList.contains('ringmode')){renderWheel(false);return}
  ws.wheel.setRing(2,ringItems(2,ws.geom),ws.idx[2],false);renderCaption();
}
function renderWheel(kf){small()?renderSeq(kf):renderRings(kf)}

function setView(v){
  st.view=v;const w=v==='wheel';
  $('wheelView').hidden=!w;$('main').hidden=w;$('searchBox').hidden=w;
  $('viewBtn').textContent=w?'切到清單檢視':'切到滾輪檢視';
  updProg();
  if(w)renderWheel();else render();
}
$('viewBtn').onclick=()=>setView(st.view==='wheel'?'list':'wheel');
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(st.view==='wheel')renderWheel(false)},200)});

/* search, random, reset */
$('s').addEventListener('input',e=>{st.s=e.target.value;if(st.s.trim())st.level=2;render()});
$('rand').onclick=()=>{
  const pool=ALL.filter(x=>!done.has(x.id));
  if(!pool.length){$('rand').textContent='全部都回答完了';return}
  const x=pool[Math.floor(Math.random()*pool.length)];
  st.s='';$('s').value='';st.k=x.k;st.t=x.t;st.level=2;
  const pos=inTy(x.k,x.t).findIndex(y=>y.id===x.id);
  ws.k=x.k;ws.t=x.t;ws.step=2;ws.idx=[KW.indexOf(x.k),TY[x.k].indexOf(x.t)+1,pos];
  render();if(st.view==='wheel')renderWheel(false);
};
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='再按一次確認清除';setTimeout(()=>{armed=false;$('reset').textContent='清除已回答'},3000);return}
  done.clear();save();armed=false;$('reset').textContent='清除已回答';render();if(st.view==='wheel')renderWheel(false);
};
setView('wheel');
</script>
